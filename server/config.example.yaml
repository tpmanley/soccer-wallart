# Copy to config.yaml and edit. Find team ids with:
#   soccer-wallart find-team usa.1 minnesota
timezone: America/Chicago

# Your teams. `leagues` = every competition they play in (scanned for their matches).
teams:
  - name: Minnesota United
    espn_id: 17362
    leagues: [usa.1, concacaf.champions, usa.open]
    # colors: [black, blue]   # optional poster colors: black white red yellow blue green

# Whole leagues to show fixtures from.
# Common ESPN slugs: eng.1 (Premier League), uefa.champions, uefa.europa, esp.1 (La Liga),
# ger.1, ita.1, fra.1, usa.1 (MLS), usa.nwsl, fifa.world
leagues: [eng.1, uefa.champions]

# What gets the big poster, in order. "teams" = any of your teams; or a league slug / team id.
featured_priority: [teams, uefa.champions, eng.1]

# Which broadcast the poster shows when a match is on several. Your services come first
# (in this order), then free over-the-air networks (ABC, CBS, NBC, FOX, Telemundo,
# Univision, UniMás), then whatever ESPN lists first.
watch:
  services: [Peacock, Paramount+, Apple TV]
  include_free: true
  # ESPN lists no US broadcasters for some competitions (the Premier League among them).
  # For those matches, look up the channels on livesoccertv.com for this country.
  livesoccertv: true
  country: USA

list_size: 5          # rows in the right-hand column
lookahead_days: 7
# The column shows today's games and results while there are any (06:00 to 06:00), and
# NEXT UP otherwise. Under NEXT UP, LAST RESULT rows show each of your teams' latest result
# from up to this many days ago (0 turns them off). One takes a NEXT UP row; two or three take two.
recent_days: 14

refresh:
  daily_at: "06:00"          # always refresh at this local time
  halftime_minutes: 55       # wake this long after kickoff (halftime score)
  fulltime_minutes: 115      # and this long after kickoff (final score)
  live_minutes: 15           # if it's still going at the full-time wake, check this often
  # How long a finished match stays on the poster with its score:
  #   next_match_day: until the daily_at refresh on the day of the next match on the board,
  #                   or hold_before_kickoff_hours before that kickoff if that is earlier
  #   fixed:          after_match_minutes after kickoff, then it drops off (the old behaviour)
  result_hold: next_match_day
  after_match_minutes: 150   # fixed: the whole hold; next_match_day: the shortest hold
  hold_before_kickoff_hours: 0.5
  result_hold_max_hours: 48  # longest hold; ends at the last daily_at refresh inside it
  min_minutes: 15
  max_hours: 12

display:
  width: 800
  height: 480
  clock: 12h                 # or 24h
  rotate: 0                  # 180 if the image shows upside down on the frame
  low_battery_percent: 20    # battery changes only force a redraw when crossing this

cache_dir: .cache
cache_ttl_minutes: 60
