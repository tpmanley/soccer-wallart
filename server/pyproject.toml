[project]
name = "soccer-wallart"
version = "0.1.0"
description = "Retro soccer fixture posters for a color e-ink wall display"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "httpx>=0.27",
  "pydantic>=2.6",
  "pyyaml>=6",
  "pillow>=10.3",
  "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
soccer-wallart = "soccer_wallart.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["soccer_wallart"]

[tool.pytest.ini_options]
testpaths = ["tests"]
